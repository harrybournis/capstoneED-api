# PostgreSQL. Versions 9.1 and up are supported.
#
# Install the pg driver:
#   gem install pg
# On OS X with Homebrew:
#   gem install pg -- --with-pg-config=/usr/local/bin/pg_config
# On OS X with MacPorts:
#   gem install pg -- --with-pg-config=/opt/local/lib/postgresql84/bin/pg_config
# On Windows:
#   gem install pg
#       Choose the win32 build.
#       Install PostgreSQL and put its /bin directory on your path.
#
# Configure Using Gemfile
# gem 'pg'
#
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DATABASE_HOST") { '127.0.0.1' } %>
  port: <%= ENV.fetch("DATABASE_PORT") { 5432 } %>
  username: <%= ENV.fetch("DATABASE_USER") { 'rails_dev' } %>
  password: <%= ENV.fetch("DATABASE_PASS") { 'rails_dev_password' } %>

development:
  <<: *default
  database: <%= ENV.fetch("DATABASE_NAME") { 'capstoned_api_development' } %>

test:
  <<: *default
  database: <%= ENV.fetch("DATABASE_NAME") { 'capstoned_api_test' } %>

production:
  <<: *default
  database: <%= ENV.fetch("DATABASE_NAME") { 'capstoned_api_prod' } %>
