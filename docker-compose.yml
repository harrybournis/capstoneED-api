services:
  postgres:
    image: postgres:17
    restart: always
    environment:
      - POSTGRES_USER=capstoned-api
      - POSTGRES_PASSWORD=capstoned-api
      - POSTGRS_DB=capstoned-api_development
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - 5432:5432

volumes:
  postgres_data:
